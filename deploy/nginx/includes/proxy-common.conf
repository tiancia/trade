proxy_http_version 1.1;
# Spring's framework forwarding filter also accepts the standard Forwarded and
# prefix headers. Strip caller values before creating this gateway's metadata.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $trade_forwarded_port;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Authorization is cleared at server scope for frontends; backend-proxy.conf
# supplies its own complete header set and forwards it for independent verification.

proxy_connect_timeout 10s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;

# Do not retry a write request against another application instance.
proxy_next_upstream off;

client_max_body_size 10m;
