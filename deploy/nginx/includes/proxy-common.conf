proxy_http_version 1.1;
# Spring's framework forwarding filter also accepts the standard Forwarded and
# prefix headers. Strip caller values before creating this gateway's metadata.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $trade_forwarded_port;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Header inheritance is all-or-nothing, so API locations repeat this include.
# Non-header defaults live at HTTP scope in proxy-defaults.conf; repeating them
# here would conflict with the SSE location's longer timeouts.
