proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Basic Auth belongs to the gateway; do not forward its password to applications.
# Application-specific operator/admin headers continue to pass through.
proxy_set_header Authorization "";
proxy_set_header X-X-Admin-Token $http_x_x_admin_token;

proxy_connect_timeout 10s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;

# Do not retry a write request against another application instance.
proxy_next_upstream off;

client_max_body_size 10m;
