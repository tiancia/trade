# HTTP-scope defaults, inherited by servers and locations. SSE overrides only
# its read/send timeouts without re-declaring these in the same context.
proxy_connect_timeout 10s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;

# Do not retry a write request against another application instance.
proxy_next_upstream off;
client_max_body_size 10m;
