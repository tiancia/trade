# HTTP context: do not log query strings (OAuth codes), bodies or Authorization.
log_format trade_audit escape=json '{"time":"$time_iso8601","source":"$remote_addr",'
    '"operator":"$remote_user","client_certificate":"$ssl_client_serial",'
    '"method":"$request_method","path":"$uri","status":$status,"request_id":"$request_id"}';
access_log /dev/stdout trade_audit;
limit_req_zone $binary_remote_addr zone=trade_operator:10m rate=10r/s;
limit_req_status 429;
limit_req zone=trade_operator burst=100 nodelay;
