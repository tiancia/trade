# This only reports the gateway process, not database/application/egress health.
location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "gateway ok\n";
}

location = /api/trading/market/candles/stream {
    include /etc/nginx/includes/backend-proxy.conf;
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header X-Accel-Buffering "no";
    add_header Cache-Control "no-cache";
}

location /api/ {
    include /etc/nginx/includes/backend-proxy.conf;
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
}
