# This only reports the gateway process, not database/application/egress health.
location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "gateway ok\n";
}

location = /api/trading/market/candles/stream {
    include /etc/nginx/includes/backend-proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header X-Accel-Buffering "no";
    add_header Cache-Control "no-cache";
}

location ~ "^/api/weibo(?:;[^/]*)?/oauth(?:;[^/]*)?/callback(?:[;/]|$)" {
    # Nginx error messages include the raw request line. Keep the sanitized access
    # record (including status and request ID) for endpoints carrying URL credentials.
    error_log /dev/null;
    include /etc/nginx/includes/backend-proxy.conf;
}

location /api/ {
    include /etc/nginx/includes/backend-proxy.conf;
}
