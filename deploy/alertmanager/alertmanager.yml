global:
  resolve_timeout: 5m
route:
  receiver: operations
  group_by: [alertname, environment]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 2h
receivers:
  - name: operations
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        http_config:
          follow_redirects: false
