name: Submit build or deployment to CNB
run-name: Submit CNB task / ${{ inputs.mode }} / ${{ inputs.service }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: Services to build or deploy in CNB
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - cockpit
          - x-console
          - frontends
          - egress
      mode:
        description: Build, deploy, or roll back selected services
        type: choice
        required: true
        default: build
        options:
          - build
          - build_deploy
          - deploy
          - rollback
      existing_release_manifest:
        description: Complete release.env text required only for deploy mode
        type: string
        required: false

permissions:
  contents: read

# This serializes submissions. CNB and the production release lock control execution.
concurrency:
  group: trade-cnb-trigger
  cancel-in-progress: false

jobs:
  submit:
    name: Submit CNB task (submission status only)
    if: github.repository == 'tiancia/trade' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Submit a task to the mainland managed builder
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          SERVICE: ${{ inputs.service }}
          MODE: ${{ inputs.mode }}
          EXISTING_RELEASE_MANIFEST: ${{ inputs.existing_release_manifest }}
        run: node deploy/scripts/trigger-cnb.cjs
